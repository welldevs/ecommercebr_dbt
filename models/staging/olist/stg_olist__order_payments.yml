version: 2

models:
  - name: stg_olist__order_payments
    description: >
      Um registro por forma de pagamento aplicada a um pedido. Grão:
      order_id + payment_sequential (chave composta — um pedido pode
      ser pago com múltiplas formas de pagamento).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    columns:
      - name: order_id
        description: "Identificador do pedido."
        tests:
          - not_null
      - name: payment_sequential
        description: "Número sequencial do pagamento dentro do pedido."
        tests:
          - not_null
      - name: payment_type
        description: "Tipo de pagamento (cartão de crédito, boleto, voucher, etc.)."
        tests:
          - not_null
      - name: payment_installments
        description: "Número de parcelas do pagamento."
        tests:
          - not_null
      - name: payment_value
        description: "Valor do pagamento."
        tests:
          - not_null
