version: 2

models:
  - name: stg_olist__order_items
    description: >
      Um registro por item de pedido. Grão: order_id + order_item_id
      (chave composta — um mesmo pedido pode ter múltiplos itens).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        description: "Identificador do pedido ao qual o item pertence."
        tests:
          - not_null
      - name: order_item_id
        description: "Número sequencial do item dentro do pedido."
        tests:
          - not_null
      - name: product_id
        description: "Identificador do produto/SKU vendido."
        tests:
          - not_null
      - name: seller_id
        description: "Identificador do vendedor responsável pelo item."
        tests:
          - not_null
      - name: shipping_limit_at
        description: "Data limite para envio do item ao transportador."
      - name: price
        description: "Preço do item."
        tests:
          - not_null
      - name: freight_value
        description: "Valor do frete do item."
        tests:
          - not_null
